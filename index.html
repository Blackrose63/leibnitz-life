<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leibnitz Life</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
#info{position:fixed;top:10px;left:10px;right:10px;color:white;background:#111b;padding:12px;border-radius:12px;z-index:2;text-align:center}
button{font-size:18px;padding:13px;border:0;border-radius:12px;background:#fff;color:#111;margin:4px}
#controls{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:3}
#move{width:145px}
</style>
</head>
<body>
<div id="info"><b>🏙️ LEIBNITZ LIFE</b><br>Gehe durch die Stadt und fahre Auto!<br><button onclick="enterCar()">🚗 Auto ein-/aussteigen</button></div>
<div id="controls"><button onclick="move(-1,0)">⬅️</button><button onclick="move(0,1)">⬆️</button><button onclick="move(0,-1)">⬇️</button><button onclick="move(1,0)">➡️</button><button onclick="jump()">🦘</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x668866,2));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,10);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250),new THREE.MeshStandardMaterial({color:0x65a85a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const roadmat=new THREE.MeshStandardMaterial({color:0x44484d});
function road(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadmat);m.position.set(x,.05,z);scene.add(m)}
road(0,0,16,220);road(0,0,220,16);
const white=new THREE.MeshStandardMaterial({color:0xffffff});
for(let i=-100;i<=100;i+=12){let l=new THREE.Mesh(new THREE.BoxGeometry(.25,.1,5),white);l.position.set(0,.12,i);scene.add(l);let a=l.clone();a.rotation.y=Math.PI/2;a.position.set(i,.12,0);scene.add(a)}
for(let x=-90;x<=90;x+=20)for(let z=-90;z<=90;z+=22){if(Math.abs(x)<18||Math.abs(z)<18)continue;let h=5+Math.random()*13;let b=new THREE.Mesh(new THREE.BoxGeometry(9,h,9),new THREE.MeshStandardMaterial({color:[0xe6c8a2,0xd6dce2,0xe9e2ca,0xc4d8b5][Math.floor(Math.random()*4)]}));b.position.set(x,h/2,z);scene.add(b);let roof=new THREE.Mesh(new THREE.ConeGeometry(6,3,4),new THREE.MeshStandardMaterial({color:0x8d4a38}));roof.position.set(x,h+1,z);roof.rotation.y=Math.PI/4;scene.add(roof)}
function makePerson(){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.8,4,8),new THREE.MeshStandardMaterial({color:0x236bdb}));body.position.y=1;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),new THREE.MeshStandardMaterial({color:0xffd1a4}));head.position.y=1.85;g.add(head);scene.add(g);return g}
const player=makePerson();player.position.set(3,0,3);
const car=new THREE.Group();const shell=new THREE.Mesh(new THREE.BoxGeometry(2.4,.8,4),new THREE.MeshStandardMaterial({color:0xe33434}));shell.position.y=.8;car.add(shell);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.7,.7,1.8),new THREE.MeshStandardMaterial({color:0x9dd8ed}));cabin.position.set(0,1.45,-.2);car.add(cabin);for(let x of [-1.2,1.2])for(let z of [-1.25,1.25]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.2,12),new THREE.MeshStandardMaterial({color:0x222222}));w.rotation.z=Math.PI/2;w.position.set(x,.4,z);car.add(w)}car.position.set(5,0,1);scene.add(car);
let driving=false,speed=0;
function move(x,z){if(driving){speed+=z*.16;car.rotation.y-=x*.12;car.position.x+=Math.sin(car.rotation.y)*speed;car.position.z+=Math.cos(car.rotation.y)*speed;speed*=.96}else{player.position.x+=x*2;player.position.z-=z*2}}
function enterCar(){driving=!driving;if(driving)player.visible=false;else{player.visible=true;player.position.set(car.position.x+3,0,car.position.z)}}
function jump(){if(!driving){player.position.y=2;setTimeout(()=>player.position.y=0,450)}}
function animate(){requestAnimationFrame(animate);let target=driving?car.position:player.position;camera.position.lerp(new THREE.Vector3(target.x,target.y+7,target.z+11),.08);camera.lookAt(target.x,target.y+1,target.z);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
