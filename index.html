<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leibnitz Life</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#17212b}
#map{position:absolute;inset:0}
.hud{position:absolute;z-index:5;color:white;background:#111a24e8;border:1px solid #ffffff30;border-radius:13px;padding:10px;box-shadow:0 4px 18px #0005}
#brand{top:12px;left:12px;font-weight:850}
small{display:block;color:#cbd5df;font-size:11px}
#stats{top:12px;right:12px;text-align:right;font-size:12px;line-height:1.5}
#hint{top:76px;left:12px;font-size:11px;max-width:65%}
#menu{left:10px;bottom:12px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 20px)}
button{color:white;background:#293747;border:1px solid #ffffff35;border-radius:10px;padding:10px;font-weight:700;font-size:12px}
button.active{background:#f0c23e;color:#171717}
#controls{position:absolute;z-index:6;right:14px;bottom:100px;width:140px;height:140px}
.pad{position:absolute;width:44px;height:44px;font-size:18px;padding:0;background:#111a24e8}
#up{top:0;left:48px}#down{bottom:0;left:48px}#left{left:0;top:48px}#right{right:0;top:48px}
#player{position:absolute;z-index:4;left:50%;top:52%;transform:translate(-50%,-50%);font-size:29px;pointer-events:none}
#toast{position:absolute;z-index:10;left:50%;bottom:250px;transform:translateX(-50%);background:#101820ed;color:white;padding:10px;border-radius:12px;font-size:12px;display:none;max-width:85%;text-align:center}
#loading{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#111b;color:white;padding:30px}
#loading div{max-width:320px}
#loading b{font-size:22px}
#loading p{color:#cbd5df;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="map"></div><div id="player">🚶</div>
<div id="brand" class="hud">LEIBNITZ LIFE<small>Echte Karte · Open World</small></div>
<div id="stats" class="hud"><b id="modeLabel">ZU FUSS</b><br><span id="speed">0 km/h</span><br>Leibnitz, Österreich</div>
<div id="hint" class="hud">Echte Karte wird geladen …</div>
<div id="menu" class="hud">
<button id="walk" class="active">🚶 Zu Fuß</button>
<button id="drive">🚗 Auto</button>
<button id="camera">🎥 Kamera: 3D</button>
<button id="reset">📍 Hauptplatz</button>
</div>
<div id="controls">
<button class="pad" id="up">▲</button><button class="pad" id="down">▼</button>
<button class="pad" id="left">◀</button><button class="pad" id="right">▶</button>
</div><div id="toast"></div>
<div id="loading"><div><b>Leibnitz Life</b><p>Die echte Karte von Leibnitz lädt. Internetverbindung erforderlich.</p></div></div>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
(()=>{
const start={lng:15.5386,lat:46.7814};
const map=new maplibregl.Map({
container:'map',
style:'https://tiles.openfreemap.org/styles/liberty',
center:[start.lng,start.lat],zoom:16.7,pitch:58,bearing:0
});
map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:false}),'top-right');
let mode='walk',camera3d=true,moving=null,speed=0;
const $=id=>document.getElementById(id);
let toastTimer;
function toast(t){
$('toast').textContent=t;$('toast').style.display='block';
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>$('toast').style.display='none',2500);
}
function ui(){
$('modeLabel').textContent=mode==='car'?'IM AUTO':'ZU FUSS';
$('speed').textContent=Math.round(speed)+' km/h';
$('player').textContent=mode==='car'?'🚗':'🚶';
$('walk').classList.toggle('active',mode==='walk');
$('drive').classList.toggle('active',mode==='car');
$('camera').textContent=camera3d?'🎥 Kamera: 3D':'🎥 Kamera: oben';
}
map.on('load',()=>{
try{
if(map.getSource('openmaptiles')){
const layers=map.getStyle().layers||[];
const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
map.addLayer({
id:'leibnitz-3d-buildings',source:'openmaptiles',
'source-layer':'building',type:'fill-extrusion',minzoom:14,
paint:{
'fill-extrusion-color':'#b8c1c8',
'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],7],
'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
'fill-extrusion-opacity':0.88
}
},label?label.id:undefined);
}
}catch(e){}
$('loading').style.display='none';
$('hint').textContent='Pfeile nutzen, um die Karte zu erkunden';
toast('Willkommen in Leibnitz! Tippe auf Auto zum Fahren.');
});
map.on('error',()=>{
if($('loading').style.display!=='none')
$('loading').querySelector('p').textContent='Karte lädt nicht? Bitte Internet prüfen und Seite neu laden.';
});
function end(){
if(moving){clearInterval(moving);moving=null}
speed=0;ui();
}
function setMode(m){
end();mode=m;ui();
toast(m==='car'?'Auto-Modus: Du bewegst dich schneller.':'Du bist zu Fuß unterwegs.');
}
$('walk').onclick=()=>setMode('walk');
$('drive').onclick=()=>setMode('car');
$('camera').onclick=()=>{
camera3d=!camera3d;
map.easeTo({pitch:camera3d?58:0,duration:450});ui();
};
$('reset').onclick=()=>{
end();
map.flyTo({center:[start.lng,start.lat],zoom:16.7,pitch:camera3d?58:0,bearing:0,duration:700});
toast('Zurück beim Hauptplatz Leibnitz.');
};
const dirs={up:[0,48],down:[0,-42],left:[48,0],right:[-48,0]};
function begin(d){
end();const v=dirs[d];if(!v)return;
speed=mode==='car'?48:5;ui();
moving=setInterval(()=>{
const f=mode==='car'?1.65:0.45;
map.panBy([v[0]*f,v[1]*f],{duration:90});
},100);
}
['up','down','left','right'].forEach(id=>{
const el=$(id);
el.addEventListener('pointerdown',e=>{
e.preventDefault();el.setPointerCapture(e.pointerId);begin(id);
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
el.addEventListener(ev,e=>{e.preventDefault();end();})
);
});
document.addEventListener('keydown',e=>{
const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
if(k[e.key]){e.preventDefault();if(!moving)begin(k[e.key]);}
if(e.key===' '){e.preventDefault();setMode(mode==='walk'?'car':'walk');}
});
document.addEventListener('keyup',e=>{
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key))end();
});
ui();
})();
</script>
</body>
</html>
